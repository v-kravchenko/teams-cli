name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: |
          cp teams_cli.py teams
          chmod +x teams
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes teams
        env:
          GH_TOKEN: ${{ github.token }}
