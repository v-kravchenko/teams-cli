name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: |
          cp teams_cli.py teams
          chmod +x teams
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/ {on = index($0, "## [" v "]") == 1; next} /^\[/ {on = 0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes[@]}" teams
        env:
          GH_TOKEN: ${{ github.token }}
